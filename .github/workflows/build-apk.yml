name: Compiler l'APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Créer le projet Android à partir de index.html
        run: |
          mkdir -p app/www
          cp index.html app/www/index.html
          cd app
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npm install @capacitor-community/speech-recognition@7 || npm install @capacitor-community/speech-recognition@latest --legacy-peer-deps
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.calculatrice.vocale",
            "appName": "Calculatrice vocale",
            "webDir": "www",
            "android": { "backgroundColor": "#0b1437" }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Autoriser le micro et la reconnaissance vocale
        run: |
          M=app/android/app/src/main/AndroidManifest.xml
          grep -q 'RECORD_AUDIO' "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n</manifest>#' "$M"
          grep -q 'RecognitionService' "$M" || sed -i 's#</manifest>#    <queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n</manifest>#' "$M"
          cat "$M"

      - name: Compiler l'APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculatrice-vocale-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
