<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1437">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Calculatrice vocale</title>
<style>
:root{
  --bg:#0b1437;
  --card:#121d52;
  --key:#18266b;
  --key-hi:#223287;
  --y:#ffd60a;
  --y-soft:rgba(255,214,10,.72);
  --line:rgba(255,214,10,.28);
  --warn:#ff9d5c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--y)}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Sans",sans-serif;
  min-height:100vh;
  padding:max(12px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom));
}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:1.25rem;margin:0;font-weight:700;letter-spacing:.2px}
.lang{display:flex;border:1.5px solid var(--y);border-radius:999px;overflow:hidden}
.lang button{
  background:transparent;color:var(--y);border:0;padding:8px 16px;font-size:.95rem;font-weight:700;cursor:pointer;
}
.lang button[aria-pressed="true"]{background:var(--y);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.heard{min-height:1.3em;font-size:.9rem;color:var(--y-soft);margin-bottom:6px;overflow-wrap:anywhere}
#expr{
  width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--line);
  color:var(--y);font-size:1.5rem;padding:6px 2px;outline:none;text-align:left;
}
#expr:focus{border-bottom-color:var(--y)}
#expr::placeholder{color:rgba(255,214,10,.4);font-size:1.05rem}
#result{
  font-size:2.6rem;font-weight:800;text-align:right;margin-top:10px;min-height:1.2em;
  overflow-wrap:anywhere;line-height:1.15;
}
#result.err{font-size:1.05rem;font-weight:600;color:var(--warn);text-align:left}
.controls{display:flex;align-items:center;gap:14px}
#mic{
  flex:0 0 auto;width:84px;height:84px;border-radius:50%;border:0;cursor:pointer;
  background:var(--y);color:var(--bg);display:grid;place-items:center;
  box-shadow:0 0 0 0 rgba(255,214,10,.5);
}
#mic svg{width:38px;height:38px}
#mic.on{animation:pulse 1.2s infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(255,214,10,.55)}
  70%{box-shadow:0 0 0 22px rgba(255,214,10,0)}
  100%{box-shadow:0 0 0 0 rgba(255,214,10,0)}
}
.side{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
#status{font-size:.95rem;min-height:1.3em;color:var(--y-soft)}
#status.err{color:var(--warn)}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.95rem;user-select:none}
.switch input{position:absolute;opacity:0;pointer-events:none}
.track{
  flex:0 0 auto;width:48px;height:28px;border-radius:999px;border:2px solid var(--y);
  position:relative;background:transparent;transition:background .2s;
}
.track::after{
  content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:var(--y);transition:transform .2s;
}
.switch input:checked + .track{background:var(--y)}
.switch input:checked + .track::after{transform:translateX(20px);background:var(--bg)}
html[dir="rtl"] .track::after{left:auto;right:2px}
html[dir="rtl"] .switch input:checked + .track::after{transform:translateX(-20px)}
.switch input:focus-visible + .track{outline:2px solid #fff;outline-offset:2px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad button{
  height:58px;border-radius:14px;border:1px solid var(--line);background:var(--key);color:var(--y);
  font-size:1.4rem;font-weight:600;cursor:pointer;
}
.pad button:active{background:var(--key-hi)}
.pad .op{background:var(--key-hi);font-weight:800}
.pad .eq{background:var(--y);color:var(--bg);font-weight:800;grid-column:span 2}
.pad .clr{color:var(--warn)}
section h2{font-size:1rem;margin:0 0 8px;font-weight:700}
.hist-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.link{background:none;border:0;color:var(--y-soft);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:4px}
#hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#hist li{
  padding:9px 10px;border-radius:10px;background:var(--key);cursor:pointer;direction:ltr;text-align:left;
  display:flex;justify-content:space-between;gap:10px;font-size:1rem;overflow-wrap:anywhere;
}
#hist li b{white-space:nowrap}
.empty{color:var(--y-soft);font-size:.9rem}
details summary{cursor:pointer;font-weight:700}
details ul{margin:8px 0 0;padding-inline-start:20px;color:var(--y-soft);font-size:.92rem;line-height:1.7}
.note{font-size:.8rem;color:var(--y-soft);text-align:center;margin:2px 0 0}
button:focus-visible,summary:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="t-title">Calculatrice vocale</h1>
    <div class="lang" role="group" aria-label="Langue">
      <button id="lang-fr" aria-pressed="true">FR</button>
      <button id="lang-ar" aria-pressed="false">عربي</button>
    </div>
  </header>

  <div class="card" dir="ltr">
    <div class="heard" id="heard"></div>
    <input id="expr" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Expression">
    <div id="result" aria-live="polite">0</div>
  </div>

  <div class="controls">
    <button id="mic" aria-label="Micro">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3.5 3.5 0 0 0 3.5-3.5v-5a3.5 3.5 0 0 0-7 0v5A3.5 3.5 0 0 0 12 14Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V19H9.5a1 1 0 1 0 0 2h5a1 1 0 1 0 0-2H13v-2.59A6 6 0 0 0 18 10.5Z"/></svg>
    </button>
    <div class="side">
      <div id="status"></div>
      <label class="switch">
        <input type="checkbox" id="tts" role="switch">
        <span class="track"></span>
        <span id="t-tts">Lire le résultat à voix haute</span>
      </label>
    </div>
  </div>

  <div class="pad" id="pad" dir="ltr"></div>

  <section class="card">
    <div class="hist-head">
      <h2 id="t-hist">Historique</h2>
      <button class="link" id="clear-hist">Effacer</button>
    </div>
    <ul id="hist"></ul>
  </section>

  <details class="card">
    <summary id="t-ex">Exemples à dire</summary>
    <ul id="examples"></ul>
  </details>

  <p class="note" id="t-note"></p>
</div>

<script>
/* CORE-START */
class CalcError extends Error{ constructor(code,info){ super(code); this.code=code; this.info=info; } }

function norm(s){
  return String(s).toLowerCase().normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/[\u064B-\u065F\u0670\u0640]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/[\u0660-\u0669]/g,function(d){return d.charCodeAt(0)-0x660;})
    .replace(/[\u06F0-\u06F9]/g,function(d){return d.charCodeAt(0)-0x6F0;});
}
function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

/* ---------- Dictionnaire des nombres ---------- */
const NUM={};
function add(k,v,t,m){ NUM[norm(k)]={t:t||'n',v:v,m:m}; }
(function(){
  const fr={zero:0,un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,dix:10,onze:11,douze:12,
    treize:13,quatorze:14,quinze:15,seize:16,vingt:20,vingts:20,trente:30,quarante:40,cinquante:50,soixante:60,
    septante:70,huitante:80,octante:80,nonante:90,quatrevingt:80,quatrevingts:80,cent:100,cents:100};
  Object.keys(fr).forEach(function(k){ add(k,fr[k]); });
  ['mille','milles'].forEach(function(k){ add(k,1000,'s'); });
  ['million','millions'].forEach(function(k){ add(k,1e6,'s'); });
  ['milliard','milliards'].forEach(function(k){ add(k,1e9,'s'); });

  const ar={'صفر':0,'واحد':1,'واحدة':1,'احد':1,'إحدى':1,'اثنان':2,'اثنين':2,'اثنا':2,'اثني':2,'اثنتان':2,'اثنتين':2,
    'ثلاثة':3,'ثلاث':3,'أربعة':4,'أربع':4,'خمسة':5,'خمس':5,'ستة':6,'ست':6,'سبعة':7,'سبع':7,
    'ثمانية':8,'ثماني':8,'ثمان':8,'تسعة':9,'تسع':9,'عشرة':10,'عشر':10,
    'عشرون':20,'عشرين':20,'ثلاثون':30,'ثلاثين':30,'أربعون':40,'أربعين':40,'خمسون':50,'خمسين':50,
    'ستون':60,'ستين':60,'سبعون':70,'سبعين':70,'ثمانون':80,'ثمانين':80,'تسعون':90,'تسعين':90,
    'مائة':100,'مئة':100,'مية':100,'مائتان':200,'مئتان':200,'مائتين':200,'مئتين':200};
  Object.keys(ar).forEach(function(k){ add(k,ar[k]); });
  [['ثلاث',300],['أربع',400],['خمس',500],['ست',600],['سبع',700],['ثمان',800],['ثماني',800],['تسع',900]].forEach(function(p){
    ['مائة','مئة','مية'].forEach(function(s){ add(p[0]+s,p[1]); });
  });
  add('ألف',1000,'s'); add('الف',1000,'s'); add('آلاف',1000,'s'); add('ألاف',1000,'s');
  add('ألفين',1000,'s',2); add('الفين',1000,'s',2);
  add('مليون',1e6,'s'); add('ملايين',1e6,'s'); add('مليار',1e9,'s'); add('مليارات',1e9,'s');
})();
const DEC=new Set(['virgule','point','فاصله','فاصل']);

function numSeq(tk,i){
  let total=0,cur=0,last=0,any=false,j=i;
  while(j<tk.length){
    const w=tk[j];
    if(w==='et'){
      const nx=NUM[tk[j+1]||''];
      if(any && nx && nx.t==='n' && nx.v>0 && nx.v<20 && last>=20 && last<100 && last%10===0){ j++; continue; }
      break;
    }
    let info=NUM[w], wa=false;
    if(!info && w.length>2 && w.charAt(0)==='و'){ info=NUM[w.slice(1)]; wa=!!info; }
    if(!info) break;
    if(info.t==='s'){
      const mult=info.m||cur||1;
      total+=mult*info.v; cur=0; last=info.v; any=true; j++; continue;
    }
    const v=info.v;
    if(any){
      if(v===100 && cur>=1 && cur<10 && last<10){ cur*=100; last=100; j++; continue; }
      let ok=false;
      if(last>=1000) ok=v<1000;
      else if(last>=100) ok=v<100;
      else if(last>=20 && last%10===0) ok=v>0 && v<20;
      else if(last===10) ok=v>0 && v<10;
      else if(last>0 && last<10) ok=(v===10)||(wa && v>=20 && v<100 && v%10===0);
      if(!ok) break;
    }
    cur+=v; last=v; any=true; j++;
  }
  return any?{v:total+cur,next:j}:null;
}

/* ---------- Règles de remplacement des phrases ---------- */
const B1='(?<![\\p{L}\\p{N}])', B2='(?![\\p{L}\\p{N}])';
function mk(list,sym){
  const alts=list.map(norm).sort(function(a,b){return b.length-a.length;}).map(escapeRe).join('|');
  return {re:new RegExp(B1+'(?:'+alts+')'+B2,'gu'),sym:sym};
}
const RULES=[
  mk(['combien font','combien ca fait','combien fait','combien','calcule','calculer','calculez','donne moi',
      'egalent','egale','egal','ca fait','كم يساوي','يساوي','تساوي','ساوي','احسب','كم'],' '),
  mk(['pour cent','pourcent','pourcentage','في المائة','في المئة','بالمائة','بالمئة','المائة','المئة','بالمية','في المية','المية'],' % '),
  mk(['racine carree de','racine carree','racine','الجذر التربيعي ل','الجذر التربيعي','جذر تربيعي ل','جذر تربيعي','جذر'],' sqrt '),
  mk(['au carre','تربيعا','تربيع','مربع'],' ^ 2 '),
  mk(['au cube','تكعيب','مكعب'],' ^ 3 '),
  mk(['parenthese ouverte','ouvre la parenthese','ouvrir la parenthese','ouvre parenthese','ouvrez parenthese',
      'قوس مفتوح','فتح قوس','افتح قوس','قوس مفتوحه','بدايه قوس'],' ( '),
  mk(['parenthese fermee','ferme la parenthese','ferme parenthese','fermer la parenthese','fermez parenthese',
      'قوس مغلق','اغلاق قوس','اغلق قوس','قوس مغلقه','قفل قوس'],' ) '),
  mk(['elevee a la puissance','a la puissance','puissance','exposant','مرفوع الي','مرفوعه الي','اس','قوه'],' ^ '),
  mk(['multiplie par','multiplier par','multiplie','fois','x','ضرب في','مضروب في','مضروبه في','مضروبا في','ضرب','ضارب','في'],' * '),
  mk(['divise par','divisee par','divise','divisee','sur','قسمه علي','مقسوم علي','مقسومه علي','مقسوما علي','قسم علي','تقسيم علي','قسمه','علي'],' / '),
  mk(['plus','زايد','زائد','جمع','اضافه','يضاف الي'],' + '),
  mk(['moins','ناقص','طرح','ينقص','مطروح من','مطروحا من','مطروح'],' - ')
];

function tokenize(text){
  let s=norm(text).replace(/\s+/g,' ').trim();
  s=s.replace(/[×✕✖·]/g,' * ').replace(/÷/g,' / ').replace(/[−–—]/g,' - ')
     .replace(/٪/g,' % ').replace(/√/g,' sqrt ').replace(/=/g,' ')
     .replace(/٫/g,'.').replace(/٬/g,'');
  s=s.replace(/(?<=\p{L})-(?=\p{L})/gu,' ');
  s=s.replace(/(\d),(\d)/g,'$1.$2');
  s=s.replace(/(\d)[ \u00a0\u202f](?=\d{3}(?!\d))/g,'$1');
  s=s.replace(/(\d) (0{2,3})(?!\d)/g,'$1$2');   /* \u00ab 6 00 \u00bb \u2192 600 (segments coup\u00e9s) */
  s=s.replace(/(\d)(?=\p{L})/gu,'$1 ').replace(/(\p{L})(?=\d)/gu,'$1 ');
  s=s.replace(/quatre vingts?(?![\p{L}\p{N}])/gu,'quatrevingt');
  s=' '+s+' ';
  RULES.forEach(function(r){ s=s.replace(r.re,r.sym); });
  s=s.replace(/%\s+(?:de|d|من)(?![\p{L}\p{N}])/gu,'% * ');
  s=s.replace(/[?!,;:'"«»]/g,' ').replace(/\.(?!\d)/g,' ');
  s=s.replace(/([+\-*\/^()%])/g,' $1 ');
  const w=s.split(/\s+/).filter(Boolean);

  const out=[]; let i=0;
  while(i<w.length){
    const t=w[i];
    if(/^[+\-*\/^()%]$/.test(t) || t==='sqrt'){ out.push(t); i++; continue; }
    if(t==='et'){ out.push('+'); i++; continue; }
    let num=null;
    if(/^\d+(\.\d+)?$/.test(t)){
      num={s:t}; i++;
      /* « 6 cents », « 3 mille », « 2 millions » : chiffre suivi d'un mot d'échelle */
      while(i<w.length){
        const nx=NUM[w[i]];
        if(nx && (nx.t==='s'||nx.v===100)){ num.s=String(parseFloat(num.s)*nx.v); i++; } else break;
      }
    }
    else { const r=numSeq(w,i); if(r){ num={s:String(r.v)}; i=r.next; } }
    if(!num) throw new CalcError('unknown',t);
    if(i<w.length && DEC.has(w[i])){
      let j=i+1, zeros='', frac=null;
      while(j<w.length && (w[j]==='zero'||w[j]==='صفر'||w[j]==='0')){ zeros+='0'; j++; }
      if(j<w.length && /^\d+$/.test(w[j])){ frac=w[j]; j++; }
      else { const r=numSeq(w,j); if(r){ frac=String(r.v); j=r.next; } }
      if(frac!==null||zeros){ num.s=num.s+'.'+zeros+(frac||''); i=j; }
    }
    out.push(parseFloat(num.s));
  }
  return out;
}

function evaluate(tk){
  let p=0;
  const isNum=function(x){return typeof x==='number';};
  function expr(){
    let v=term();
    while(tk[p]==='+'||tk[p]==='-'){
      const op=tk[p++]; let r;
      if(isNum(tk[p]) && tk[p+1]==='%' && ['*','/','^'].indexOf(tk[p+2])<0){ r=v*tk[p]/100; p+=2; }
      else r=term();
      v=(op==='+')?v+r:v-r;
    }
    return v;
  }
  function term(){
    let v=unary();
    while(tk[p]==='*'||tk[p]==='/'){
      const op=tk[p++]; const r=unary();
      if(op==='/'){ if(r===0) throw new CalcError('div0'); v/=r; } else v*=r;
    }
    return v;
  }
  function unary(){
    const t=tk[p];
    if(t==='-'){ p++; return -unary(); }
    if(t==='+'){ p++; return unary(); }
    if(t==='sqrt'){ p++; const a=unary(); if(a<0) throw new CalcError('math'); return Math.sqrt(a); }
    return power();
  }
  function power(){
    let b=primary();
    if(tk[p]==='^'){ p++; b=Math.pow(b,unary()); }
    return b;
  }
  function primary(){
    const t=tk[p];
    if(isNum(t)){ p++; let v=t; while(tk[p]==='%'){ p++; v/=100; } return v; }
    if(t==='('){ p++; const v=expr(); if(tk[p]===')') p++; return v; }
    throw new CalcError('syntax');
  }
  if(!tk.length) throw new CalcError('empty');
  const v=expr();
  if(p<tk.length) throw new CalcError('syntax');
  if(!isFinite(v)) throw new CalcError('math');
  return v;
}

function showExpr(tk){
  const map={'*':'×','/':'÷','-':'−','sqrt':'√'};
  return tk.map(function(t){ return typeof t==='number'?String(t):(map[t]||t); }).join(' ')
    .replace(/\( /g,'(').replace(/ \)/g,')').replace(/√ /g,'√').replace(/ %/g,'%');
}
function calculate(text){
  const tk=tokenize(text);
  const v=parseFloat(evaluate(tk).toPrecision(12));
  return {expr:showExpr(tk),value:v};
}
/* CORE-END */

/* ---------- Interface ---------- */
const I18N={
  fr:{
    title:'Calculatrice vocale', tts:'Lire le résultat à voix haute', hist:'Historique', clear:'Effacer',
    empty:'Aucun calcul pour le moment.', ph:'Dites ou saisissez un calcul',
    tap:'Appuyez sur le micro et parlez.', listening:'Je vous écoute…', heard:'Entendu : ',
    prompt:'Dites l’opération',
    nosr:'La reconnaissance vocale n’est pas disponible sur ce navigateur. Utilisez Chrome ou le clavier ci-dessous.',
    err:{unknown:function(x){return 'Mot non compris : « '+x+' ».';},syntax:'Expression incomplète ou incorrecte.',
         div0:'Division par zéro impossible.',math:'Opération mathématique impossible.',empty:'Rien à calculer.'},
    mic:{'not-allowed':'Accès au micro refusé. Autorisez-le dans les réglages du navigateur.',
         'service-not-allowed':'Accès au micro refusé. Autorisez-le dans les réglages du navigateur.',
         'no-speech':'Aucune voix détectée. Réessayez.','network':'Connexion internet requise pour la reconnaissance vocale.',
         'audio-capture':'Aucun micro détecté.'},
    exTitle:'Exemples à dire',
    ex:['« douze plus huit fois trois »','« racine carrée de seize »','« vingt pour cent de deux cents »',
        '« trois virgule cinq fois deux »','« deux puissance dix »','« parenthèse ouverte deux plus trois parenthèse fermée fois quatre »'],
    note:'Reconnaissance vocale : Chrome recommandé, connexion internet et autorisation du micro requises.',
    speak:function(neg,s){return 'Le résultat est '+(neg?'moins ':'')+s.replace('.',',');}
  },
  ar:{
    title:'آلة حاسبة صوتية', tts:'قراءة النتيجة بصوت عالٍ', hist:'السجل', clear:'مسح',
    empty:'لا توجد عمليات بعد.', ph:'انطق أو اكتب عملية حسابية',
    tap:'اضغط على الميكروفون وتكلّم.', listening:'أنا أستمع إليك…', heard:'سُمع: ',
    prompt:'انطق العملية',
    nosr:'التعرف على الصوت غير متاح في هذا المتصفح. استعمل Chrome أو لوحة الأرقام أدناه.',
    err:{unknown:function(x){return 'كلمة غير مفهومة: «'+x+'».';},syntax:'العملية ناقصة أو غير صحيحة.',
         div0:'لا يمكن القسمة على صفر.',math:'عملية رياضية غير ممكنة.',empty:'لا يوجد ما يُحسب.'},
    mic:{'not-allowed':'تم رفض الوصول إلى الميكروفون. اسمح به من إعدادات المتصفح.',
         'service-not-allowed':'تم رفض الوصول إلى الميكروفون. اسمح به من إعدادات المتصفح.',
         'no-speech':'لم يتم التقاط أي صوت. حاول مجددًا.','network':'يلزم الاتصال بالإنترنت للتعرف على الصوت.',
         'audio-capture':'لم يتم العثور على ميكروفون.'},
    exTitle:'أمثلة للنطق',
    ex:['«خمسة وعشرون زائد ثلاثة»','«ثلاثة ضرب أربعة»','«جذر تربيعي ستة عشر»',
        '«عشرون في المائة من مائتين»','«اثنان أس عشرة»','«ثلاثة آلاف ناقص خمسمائة»'],
    note:'التعرف على الصوت: يُنصح بمتصفح Chrome، ويلزم الإنترنت وإذن الميكروفون.',
    speak:function(neg,s){return 'النتيجة '+(neg?'سالب ':'')+s;}
  }
};

const $=function(id){return document.getElementById(id);};
const inp=$('expr'), resEl=$('result'), heardEl=$('heard'), statusEl=$('status'), micBtn=$('mic');
let lang='fr', listening=false, rec=null, history=[];

function store(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

function setStatus(msg,isErr){ statusEl.textContent=msg||''; statusEl.className=isErr?'err':''; }
function fmt(v){ return v.toLocaleString('fr-FR',{maximumFractionDigits:10}); }

function applyLang(l){
  lang=l; const t=I18N[l];
  document.documentElement.lang=l;
  document.documentElement.dir=(l==='ar')?'rtl':'ltr';
  $('lang-fr').setAttribute('aria-pressed',String(l==='fr'));
  $('lang-ar').setAttribute('aria-pressed',String(l==='ar'));
  $('t-title').textContent=t.title; document.title=t.title;
  $('t-tts').textContent=t.tts; $('t-hist').textContent=t.hist; $('clear-hist').textContent=t.clear;
  $('t-ex').textContent=t.exTitle; $('t-note').textContent=t.note;
  inp.placeholder=t.ph;
  $('examples').innerHTML=''; t.ex.forEach(function(x){ const li=document.createElement('li'); li.textContent=x; $('examples').appendChild(li); });
  setStatus(listening?t.listening:t.tap);
  renderHist();
  store('cv-lang',l);
}

/* ---- Clavier ---- */
const KEYS=[
  ['C','clear','clr'],['(','('],[')',')'],['⌫','back'],
  ['7','7'],['8','8'],['9','9'],['÷','÷','op'],
  ['4','4'],['5','5'],['6','6'],['×','×','op'],
  ['1','1'],['2','2'],['3','3'],['−','−','op'],
  ['0','0'],['.','.'],['^','^','op'],['+','+','op'],
  ['√','√(','op'],['%','%','op'],['=','eq','eq']
];
KEYS.forEach(function(k){
  const b=document.createElement('button'); b.type='button'; b.textContent=k[0];
  if(k[2]) b.className=k[2];
  b.addEventListener('click',function(){ press(k[1]); });
  $('pad').appendChild(b);
});
function press(a){
  if(a==='clear'){ inp.value=''; resEl.className=''; resEl.textContent='0'; heardEl.textContent=''; return; }
  if(a==='eq'){ run(inp.value); return; }
  const s=(inp.selectionStart==null)?inp.value.length:inp.selectionStart;
  const e=(inp.selectionEnd==null)?s:inp.selectionEnd;
  if(a==='back'){
    if(s!==e) inp.setRangeText('',s,e,'end');
    else if(s>0) inp.setRangeText('',s-1,s,'end');
    return;
  }
  inp.setRangeText(a,s,e,'end');
}
inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); run(inp.value); } });

/* ---- Calcul ---- */
function errMsg(e){
  const t=I18N[lang].err;
  if(e instanceof CalcError){ const m=t[e.code]; return typeof m==='function'?m(e.info):(m||t.syntax); }
  return t.syntax;
}
function showError(e){ resEl.className='err'; resEl.textContent=errMsg(e); }
function showResult(r){
  resEl.className=''; resEl.textContent=fmt(r.value);
  inp.value=r.expr;
  addHist(r.expr,fmt(r.value));
  if($('tts').checked) speak(r.value);
}
function run(text){
  try{ showResult(calculate(text)); }
  catch(e){ showError(e); }
}

/* ---- Lecture vocale facultative ---- */
function speak(v){
  if(!('speechSynthesis' in window)) return;
  try{
    const t=I18N[lang]; let s=String(v); const neg=s.charAt(0)==='-'; if(neg) s=s.slice(1);
    const u=new SpeechSynthesisUtterance(t.speak(neg,s));
    u.lang=(lang==='ar')?'ar-SA':'fr-FR';
    const voices=speechSynthesis.getVoices();
    const pre=lang==='ar'?'ar':'fr';
    for(let i=0;i<voices.length;i++){ if(voices[i].lang.toLowerCase().indexOf(pre)===0){ u.voice=voices[i]; break; } }
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
$('tts').addEventListener('change',function(){
  store('cv-tts',this.checked?'1':'0');
  if(!this.checked && 'speechSynthesis' in window) speechSynthesis.cancel();
});

/* ---- Reconnaissance vocale ---- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
/* Dans l'APK (Capacitor), la reconnaissance vocale passe par le plugin natif Android */
const NSR=(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()&&window.Capacitor.Plugins)
  ?window.Capacitor.Plugins.SpeechRecognition:null;
function handleMatches(list){
  if(!list||!list.length){ setStatus(I18N[lang].mic['no-speech'],true); return; }
  heardEl.textContent=I18N[lang].heard+list[0];
  let firstErr=null;
  for(let k=0;k<list.length;k++){
    try{ showResult(calculate(list[k])); setStatus(I18N[lang].tap); return; }
    catch(e){ if(!firstErr) firstErr=e; }
  }
  inp.value=list[0];
  showError(firstErr);
}
/* Reconnaissance native Android avec la fenêtre vocale de Google (popup) :
   elle n'enregistre qu'une fois prête (« Parlez maintenant ») et attend la fin de la phrase,
   ce qui évite de perdre le début et la fin de l'opération. */
let nativeStop=false;
async function startNative(){
  try{
    const av=await NSR.available();
    if(!av||!av.available){ setStatus(I18N[lang].nosr,true); return; }
    let p=await NSR.checkPermissions();
    if(!p||p.speechRecognition!=='granted'){ p=await NSR.requestPermissions(); }
    if(!p||p.speechRecognition!=='granted'){ setStatus(I18N[lang].mic['not-allowed'],true); return; }
  }catch(e){
    setStatus(String((e&&e.message)||e||''),true); return;
  }
  heardEl.textContent=''; resEl.className=''; setStatus('');
  setListening(true);
  try{
    const r=await NSR.start({language:(lang==='ar')?'ar-SA':'fr-FR',maxResults:5,prompt:I18N[lang].prompt,partialResults:false,popup:true});
    setListening(false);
    handleMatches(r&&r.matches);
  }catch(e){
    setListening(false);
    const msg=String((e&&e.message)||e||'');
    if(/denied|permission/i.test(msg)) setStatus(I18N[lang].mic['not-allowed'],true);
    else if(/no match|no speech|timeout|cancel|abort/i.test(msg)) setStatus(I18N[lang].mic['no-speech'],true);
    else setStatus(msg,true);
  }
}
function setListening(on){
  listening=on; micBtn.classList.toggle('on',on);
  setStatus(on?I18N[lang].listening:I18N[lang].tap);
}
function startRec(){
  rec=new SR();
  rec.lang=(lang==='ar')?'ar-SA':'fr-FR';
  rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=4;
  rec.onstart=function(){ setListening(true); };
  rec.onerror=function(e){
    const m=I18N[lang].mic[e.error];
    if(e.error!=='aborted') setStatus(m||('Erreur : '+e.error),true);
  };
  rec.onend=function(){ listening=false; micBtn.classList.remove('on'); if(!statusEl.classList.contains('err')) setStatus(I18N[lang].tap); };
  rec.onresult=function(ev){
    const last=ev.results[ev.results.length-1];
    if(!last.isFinal){
      let tmp=''; for(let i=0;i<ev.results.length;i++) tmp+=ev.results[i][0].transcript;
      heardEl.textContent=I18N[lang].heard+tmp; return;
    }
    heardEl.textContent=I18N[lang].heard+last[0].transcript;
    let firstErr=null;
    for(let k=0;k<last.length;k++){
      try{ showResult(calculate(last[k].transcript)); setStatus(I18N[lang].tap); return; }
      catch(e){ if(!firstErr) firstErr=e; }
    }
    inp.value=last[0].transcript;
    showError(firstErr);
  };
  try{ rec.start(); }catch(e){ setStatus(String(e),true); }
}
micBtn.addEventListener('click',function(){
  if(NSR){
    if(listening){ nativeStop=true; try{ NSR.stop(); }catch(e){} return; }
    if('speechSynthesis' in window) speechSynthesis.cancel();
    startNative(); return;
  }
  if(!SR){ setStatus(I18N[lang].nosr,true); return; }
  if(listening){ rec.stop(); return; }
  if('speechSynthesis' in window) speechSynthesis.cancel();
  setStatus('');
  startRec();
});

/* ---- Historique ---- */
function addHist(expr,res){
  history.unshift({e:expr,r:res});
  history=history.slice(0,30);
  store('cv-hist',JSON.stringify(history));
  renderHist();
}
function renderHist(){
  const ul=$('hist'); ul.innerHTML='';
  if(!history.length){ const li=document.createElement('li'); li.className='empty'; li.style.background='none'; li.style.cursor='default';
    li.style.direction=(lang==='ar')?'rtl':'ltr'; li.textContent=I18N[lang].empty; ul.appendChild(li); return; }
  history.forEach(function(h){
    const li=document.createElement('li');
    const a=document.createElement('span'); a.textContent=h.e;
    const b=document.createElement('b'); b.textContent='= '+h.r;
    li.appendChild(a); li.appendChild(b);
    li.addEventListener('click',function(){ inp.value=h.e; resEl.className=''; resEl.textContent=h.r; });
    ul.appendChild(li);
  });
}
$('clear-hist').addEventListener('click',function(){ history=[]; store('cv-hist','[]'); renderHist(); });

/* ---- Démarrage ---- */
$('lang-fr').addEventListener('click',function(){ applyLang('fr'); });
$('lang-ar').addEventListener('click',function(){ applyLang('ar'); });
try{ history=JSON.parse(load('cv-hist')||'[]')||[]; }catch(e){ history=[]; }
$('tts').checked=(load('cv-tts')==='1');
applyLang(load('cv-lang')==='ar'?'ar':'fr');
if(!SR && !NSR) setStatus(I18N[lang].nosr,true);
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
